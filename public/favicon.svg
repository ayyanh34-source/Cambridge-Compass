<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <circle cx="32" cy="32" r="31" fill="#1A1A1A"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#C4A678" stroke-width="1.5"/>

  <!-- Cardinal North dot -->
  <circle cx="32" cy="10" r="2.4" fill="#C4A678"/>

  <!-- Needle: gold north half -->
  <polygon points="32,14 38,32 32,32" fill="#DFC398"/>
  <polygon points="32,14 26,32 32,32" fill="#A88B5D"/>

  <!-- Needle: dark south half -->
  <polygon points="32,50 38,32 32,32" fill="#3F3F46"/>
  <polygon points="32,50 26,32 32,32" fill="#18181B"/>

  <!-- Center pivot -->
  <circle cx="32" cy="32" r="5.5" fill="#F9F7F2" stroke="#C4A678" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="2.4" fill="#1A1A1A"/>
</svg>
